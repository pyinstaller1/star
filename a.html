<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">

<title>OCR 문자 인식</title>

<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>


<style>

body {
    font-family:"Segoe UI", Arial, sans-serif;
    background:#f5f6fa;
    padding:25px;
}


h2 {
    margin-bottom:15px;
    color:#333;
}



/* 사용법 */

.info {

    width:900px;

    background:white;

    padding:15px 20px;

    border-radius:12px;

    box-shadow:
    0 3px 15px rgba(0,0,0,0.1);

    line-height:1.6;

    color:#555;

}




/* OCR 결과 */

#resultBox {

    margin-top:20px;

    width:900px;

    min-height:300px;

    background:white;

    border-radius:15px;

    padding:25px;

    box-shadow:
    0 5px 20px rgba(0,0,0,0.15);

}



#status {

    font-size:18px;

    color:#555;

    margin-bottom:15px;

}



#result {

    font-size:20px;

    line-height:1.6;

    white-space:pre-wrap;

}





/* OCR 영역 */

#box {

    position:absolute;

    left:1000px;

    top:150px;

    width:500px;

    height:200px;

    border:5px solid red;

    box-sizing:border-box;

    cursor:move;

}




/* 크기 조절 */

#resize {

    position:absolute;

    width:18px;

    height:18px;

    right:-9px;

    bottom:-9px;

    background:red;

    border-radius:50%;

    cursor:se-resize;

}



/* 우클릭 메뉴 */

#menu {

    display:none;

    position:absolute;

    background:white;

    border:1px solid #ccc;

    box-shadow:
    0 3px 10px rgba(0,0,0,0.2);

    z-index:9999;

}


#menu div {

    padding:10px 40px;

    cursor:pointer;

}


#menu div:hover {

    background:#eee;

}


</style>

</head>




<body>


<h2>OCR 문자 인식</h2>


<div class="info">

<b>사용 방법</b><br>

1. 빨간 영역을 원하는 위치로 이동하세요.<br>
2. 오른쪽 아래 빨간 점으로 크기를 조절하세요.<br>
3. 다른 화면에서 Print Screen을 누르세요.<br>
4. Ctrl + V 또는 우클릭 → 붙여넣기

</div>



<div id="resultBox">

    <div id="status">
        대기중...
    </div>


    <div id="result"></div>

</div>




<!-- OCR 영역 -->

<div id="box">

    <div id="resize"></div>

</div>



<!-- 우클릭 메뉴 -->

<div id="menu">

    <div id="pasteBtn">
        붙여넣기
    </div>

</div>




<script>


let box = document.getElementById("box");

let resize = document.getElementById("resize");



// ==========================
// OCR 로딩 표시
// ==========================


let loadingTimer = null;

let loadingIndex = 0;


const loadingChars = [

    "╱",
    "━",
    "╲",
    "┃"

];




// ==========================
// 영역 이동
// ==========================


let moving=false;

let offsetX=0;

let offsetY=0;



box.addEventListener("mousedown",function(e){


    if(e.target===resize)
        return;


    moving=true;


    offsetX =
    e.clientX - box.offsetLeft;


    offsetY =
    e.clientY - box.offsetTop;


});




document.addEventListener("mousemove",function(e){


    if(moving){


        box.style.left =
        e.clientX-offsetX+"px";


        box.style.top =
        e.clientY-offsetY+"px";


    }


});




document.addEventListener("mouseup",function(){

    moving=false;

});







// ==========================
// 크기 조절
// ==========================


let resizing=false;



resize.addEventListener("mousedown",function(e){


    e.stopPropagation();


    resizing=true;


});





document.addEventListener("mousemove",function(e){



    if(resizing){


        let width =
        e.clientX-box.offsetLeft;


        let height =
        e.clientY-box.offsetTop;



        if(width>50)

            box.style.width =
            width+"px";


        if(height>30)

            box.style.height =
            height+"px";


    }


});





document.addEventListener("mouseup",function(){


    resizing=false;


});





// ==========================
// OCR 실행
// ==========================

function runOCR(blob){


    document.getElementById("result").innerText="";


    clearInterval(loadingTimer);


    loadingIndex=0;



    loadingTimer=setInterval(function(){


        document.getElementById("status").innerText =
        "OCR 인식중 " + loadingChars[loadingIndex];


        loadingIndex++;


        if(loadingIndex>=loadingChars.length)

            loadingIndex=0;


    },400);




    let img=new Image();



    img.onload=function(){



        /*
          Print Screen 이미지 크기
        */

        let imgWidth = img.width;

        let imgHeight = img.height;



        /*
          현재 화면 크기
        */

        let screenWidth = screen.width;

        let screenHeight = screen.height;



        /*
          화면 비율 보정
        */

        let scaleX =
        imgWidth / screenWidth;


        let scaleY =
        imgHeight / screenHeight;




        /*
          빨간 박스 실제 위치
          브라우저 좌표
        */

        let rect =
        box.getBoundingClientRect();



        let x =
        rect.left * scaleX;


        let y =
        rect.top * scaleY;


        let w =
        rect.width * scaleX;


        let h =
        rect.height * scaleY;




        let crop =
        document.createElement("canvas");



        crop.width=w;

        crop.height=h;




        let ctx =
        crop.getContext("2d");




        ctx.drawImage(

            img,

            x,
            y,
            w,
            h,

            0,
            0,
            w,
            h

        );





        Tesseract.recognize(

            crop,

            "kor+eng",

            {

                logger:function(m){

                    console.log(m);

                }

            }

        )

        .then(({data:{text}})=>{


            clearInterval(loadingTimer);



            document.getElementById("status").innerText =
            "OCR 완료";



            document.getElementById("result").innerText =
            text;


        });



    };



    img.src =
    URL.createObjectURL(blob);


}






// ==========================
// Ctrl + V
// ==========================


document.addEventListener("paste",function(e){


    for(let item of e.clipboardData.items){


        if(item.type.startsWith("image")){


            runOCR(item.getAsFile());


        }


    }


});






// ==========================
// 우클릭 메뉴
// ==========================


let menu =
document.getElementById("menu");



document.addEventListener("contextmenu",function(e){


    e.preventDefault();



    menu.style.left =
    e.clientX+"px";


    menu.style.top =
    e.clientY+"px";


    menu.style.display="block";


});





document.addEventListener("click",function(){


    menu.style.display="none";


});






// ==========================
// 우클릭 붙여넣기
// ==========================


document.getElementById("pasteBtn")
.addEventListener("click",function(){



    menu.style.display="none";



    navigator.clipboard.read()

    .then(function(items){



        for(let item of items){


            for(let type of item.types){


                if(type.startsWith("image")){


                    item.getType(type)

                    .then(function(blob){


                        runOCR(blob);


                    });


                }


            }


        }


    });


});



</script>


</body>

</html>
